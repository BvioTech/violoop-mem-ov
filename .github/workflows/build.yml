name: Build and Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mem-ov-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NFPM_VERSION: "2.46.3"
  NPM_CONFIG_FETCH_RETRIES: "5"

jobs:
  service:
    name: Service regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install service test dependencies
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Service tests
        run: npm run test:service

  build:
    name: Debian 12 ARM64 build and package tests
    needs: service
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container: node:24-bookworm
    env:
      CI: "true"
      CARGO_BUILD_JOBS: "2"
      OV_REQUIRE_RAGFS_BUILD: "1"
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check device platform and release version
        run: |
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 12
          node <<'JS'
          const pkg = require('./package.json');
          if (process.platform !== 'linux' || process.arch !== 'arm64' ||
              process.versions.node.split('.')[0] !== process.env.NODE_VERSION) {
            throw new Error('Device packages require Linux ARM64 and Node.js 24');
          }
          if (process.env.GITHUB_EVENT_NAME === 'push' &&
              process.env.GITHUB_REF_TYPE === 'tag' &&
              process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('Release tag must equal v + package.json version');
          }
          JS

      - name: Install native build dependencies and uv
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential python3 python3-dev python3-venv pkg-config \
            libssl-dev liblzma-dev libbz2-dev zlib1g-dev ca-certificates curl git xz-utils
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 11)'
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install uv
          printf '%s\n' "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"

      - name: Install nfpm
        run: |
          ARCHIVE="nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz"
          BASE="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/nfpm-checksums.txt" "$BASE/checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing nfpm-checksums.txt)
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C /usr/local/bin nfpm
          nfpm --version

      - name: Set up the complete native engine
        run: npm run setup -- --python /usr/bin/python3 --bootstrap-rust

      - name: Service and engine tests
        run: npm test

      - name: Native integration tests
        run: npm run test:integration

      - name: Build and test the extracted Debian package
        run: npm run build:deb

      - name: Generate package checksums
        working-directory: dist
        run: |
          for file in *.deb; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Upload tested packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-files-arm64
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish Release and notify APT
    needs: build
    if: github.repository == 'BvioTech/violoop-mem-ov' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-files-arm64
          path: dist

      - name: Check package integrity
        working-directory: dist
        run: sha256sum --check --strict *.deb.sha256

      - name: Publish all assets before making the Release visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE=true
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --generate-notes --prerelease="$PRERELEASE" \
            dist/*.deb dist/*.deb.sha256
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  notify-apt:
    name: Notify APT repository
    needs: release
    if: github.repository == 'BvioTech/violoop-mem-ov' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify APT repository
        env:
          APT_WEBHOOK_SECRET: ${{ secrets.APT_WEBHOOK_SECRET }}
          HOOK_URL: https://deb.violoop.ai/hook/release
        run: |
          node <<'JS'
          const { createHmac } = require('node:crypto');
          async function main() {
            const secret = process.env.APT_WEBHOOK_SECRET;
            if (!secret) throw new Error('Configure the APT_WEBHOOK_SECRET repository secret');
            const body = JSON.stringify({ repo: process.env.GITHUB_REPOSITORY, tag: process.env.GITHUB_REF_NAME });
            const signature = 'sha256=' + createHmac('sha256', secret).update(body).digest('hex');
            const response = await fetch(process.env.HOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Hub-Signature-256': signature },
              body,
              signal: AbortSignal.timeout(30000),
            });
            if (response.status !== 202) {
              throw new Error(`APT webhook returned ${response.status}: ${await response.text()}`);
            }
            console.log('APT sync accepted; check the APT package index for publication completion');
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
