name: Tests

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mem-ov-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  NPM_CONFIG_FETCH_RETRIES: "5"

jobs:
  build-commands:
    name: Build command regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test real build command processes
        run: python -m unittest discover -s tests -p test_build_commands.py -v

      - name: Memory prefetch query regressions
        run: python engine/tests/session/memory/test_legacy_migration_query.py

      - name: Verify npm can be invoked from Python
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from common import run; run('npm', '--version')"

  service:
    name: Service regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install service test dependencies
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Service tests
        run: npm run test:service
